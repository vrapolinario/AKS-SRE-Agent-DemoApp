apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-traffic
  namespace: sre-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-traffic
  template:
    metadata:
      labels:
        app: demo-traffic
        app.kubernetes.io/part-of: aks-sre-demo
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: traffic
          image: curlimages/curl:8.12.1
          command: ["/bin/sh", "-c"]
          args:
            - |
              while true; do
                if code=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
                  --connect-timeout 5 --max-time 10 http://demo-web/api/status); then
                  printf '%s target=demo-web/api/status http_status=%s\n' "$(date -u +%FT%TZ)" "$code"
                else
                  printf '%s target=demo-web/api/status transport_error=true\n' "$(date -u +%FT%TZ)" >&2
                fi
                sleep 2
              done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
